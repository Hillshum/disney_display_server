name: CD Pipeline
on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

    #   - name: Set up Node.js
    #     uses: actions/setup-node@v2
    #     with:
    #       node-version: "20"

    #   - name: NPM Install
    #     run: npm ci

    #   - name: Build
    #     run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
        #   platforms: linux/arm64
          tags: ghcr.io/hillshum/disney_server:latest
